# =============================================================================
# OpenAPI Configuration Authentication Properties
# =============================================================================
# This file contains authentication credentials and API configuration settings
# for REST Assured API testing.
#
# Properties can be overridden by environment variables with the AUTH_ prefix.
# Example: AUTH_bearerAuth_token will override bearerAuth_token
# =============================================================================

# -----------------------------------------------------------------------------
# API Configuration
# -----------------------------------------------------------------------------

# Base URL for API requests
api_baseUrl=http://localhost:8080/OpenAPIExample/

# Environment setting (dev, staging, production)
api_environment=dev

# -----------------------------------------------------------------------------
# Authentication - Bearer Token (bearerAuth)
# -----------------------------------------------------------------------------
# JWT Authorization header using the Bearer scheme.
# Example: "Authorization: Bearer {token}"

# JWT Bearer token for authentication
bearerAuth_token=<your-jwt-bearer-token-here>
